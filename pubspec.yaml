name: securewave_app
description: SecureWave - Secure Communication App
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI и анимации
  cupertino_icons: ^1.0.6
  animations: ^2.0.10
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1
  mask_text_input_formatter: ^2.9.0
  
  # Сетевые запросы
  http: ^1.2.0
  dio: ^5.4.3
  web_socket_channel: ^2.4.0
  
  # Хранение данных
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Управление состоянием
  provider: ^6.1.2
  
  # Работа с медиа - ОБНОВЛЕНО
  image_picker: ^1.2.0
  file_picker: ^8.1.4  # ОБНОВЛЕНО: последняя версия
  cached_network_image: ^3.3.1
  video_player: ^2.8.2
  video_thumbnail: ^0.5.3  # Генерация thumbnail для видео
  flutter_image_compress: ^2.3.0  # Сжатие изображений
  record: ^5.2.0  # Запись аудио
  just_audio: ^0.9.40  # Воспроизведение аудио
  wakelock_plus: ^1.2.1  # Предотвращение блокировки экрана во время записи
  
  # Утилиты
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.3.3
  crypto: ^3.0.3
  url_launcher: ^6.2.5
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_webrtc: ^1.2.0  # ОБНОВЛЕНО: стабильная версия
  gal: ^2.1.0  # Сохранение изображений в галерею (совместим с новым AGP)
  permission_handler: ^11.3.1  # Разрешения для сохранения файлов
  
  # Иконки и изображения
  flutter_svg: ^2.0.10
  font_awesome_flutter: ^10.7.0

  #Пуш увидомления
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.0.0


  # Уведомления - УДАЛЕНО для упрощения
  # flutter_local_notifications: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

dependency_overrides:
  record_linux: ^1.2.0  # Обновляем record_linux для совместимости

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/