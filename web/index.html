<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SecureWave - Secure Communication App">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SecureWave">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SecureWave</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999;
    }
    
    #loading-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    #loading-title {
      font-size: 32px;
      font-weight: bold;
      color: white;
      margin-bottom: 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #loading-text {
      margin-top: 20px;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-icon">🔐</div>
    <div id="loading-title">SecureWave</div>
    <div class="spinner"></div>
    <div id="loading-text">Загрузка...</div>
  </div>

  <!-- ВАЖНО: Firebase SDK должен загружаться ПЕРВЫМ -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>

  <!-- Firebase Configuration -->
  <script>
    console.log('[HTML] Инициализация Firebase...');
    
    // Конфигурация Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAW5HurHMo1l9ub2XKyr2nk-yP22bc_6F4",
      authDomain: "wave-messenger-56985.firebaseapp.com",
      projectId: "wave-messenger-56985",
      storageBucket: "wave-messenger-56985.firebasestorage.app",
      messagingSenderId: "394959992893",
      appId: "1:394959992893:web:c7d493658ad06278661254"
    };

    // Инициализация Firebase
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        console.log('✅ Firebase инициализирован');
        console.log('✅ Firebase config:', firebaseConfig);
        
        // Проверяем что messaging доступен
        if (firebase.messaging.isSupported()) {
          console.log('✅ Firebase Messaging поддерживается');
        } else {
          console.warn('⚠️ Firebase Messaging не поддерживается в этом браузере');
        }
      } else {
        console.error('❌ Firebase SDK не загружен');
      }
    } catch (error) {
      console.error('❌ Ошибка инициализации Firebase:', error);
    }
  </script>

  <!-- Flutter loader -->
  <script src="flutter.js" defer></script>
  <script>
    // ⭐⭐⭐ ВЕРСИОНИРОВАНИЕ: Принудительное обновление кэша
    var APP_VERSION = 'v' + Date.now();
    console.log('[HTML] App version:', APP_VERSION);
    
    window.addEventListener('load', function(ev) {
      console.log('[HTML] Page loaded, starting Flutter...');
      
      var serviceWorkerVersion = null;
      
      if (typeof _flutter !== 'undefined') {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function(engineInitializer) {
            console.log('[HTML] Flutter entrypoint loaded');
            engineInitializer.initializeEngine().then(function(appRunner) {
              console.log('[HTML] Flutter engine initialized, running app...');
              appRunner.runApp();
              
              // Скрываем экран загрузки
              setTimeout(function() {
                const loading = document.getElementById('loading');
                if (loading) {
                  loading.style.opacity = '0';
                  loading.style.transition = 'opacity 0.3s';
                  setTimeout(function() {
                    loading.remove();
                  }, 300);
                }
              }, 1000);
            });
          }
        });
      }
    });
  </script>

  <!-- ========================================= -->
  <!-- РЕГИСТРАЦИЯ FIREBASE SERVICE WORKER       -->
  <!-- ========================================= -->
  <script>
    console.log('[HTML] Регистрация Service Worker...');
    
    // ⭐⭐⭐ ВЕРСИОНИРОВАНИЕ: Принудительное обновление кэша
    var APP_VERSION = 'v' + Date.now();
    console.log('[HTML] App version:', APP_VERSION);
    
    if ('serviceWorker' in navigator) {
      // ⭐⭐⭐ НОВОЕ: Очищаем все service workers перед регистрацией (для обновлений)
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister().then(function(success) {
            if(success) {
              console.log('[HTML] 🧹 Старый Service Worker удален для обновления');
            }
          });
        }
      });
      
      // ⭐⭐⭐ НОВОЕ: Очищаем кэш браузера для main.dart.js
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name).then(function(success) {
              if (success) {
                console.log('[HTML] 🧹 Кэш удален:', name);
              }
            });
          }
        });
      }
      
      // Ждем полной загрузки страницы
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/firebase-messaging-sw.js?v=' + APP_VERSION)
          .then((registration) => {
            console.log('✅ Service Worker зарегистрирован:', registration.scope);
            console.log('✅ Registration:', registration);
            
            // Проверяем статус Service Worker
            if (registration.active) {
              console.log('✅ Service Worker активен');
            } else if (registration.installing) {
              console.log('⏳ Service Worker устанавливается...');
            } else if (registration.waiting) {
              console.log('⏳ Service Worker ожидает активации...');
            }
          })
          .catch((error) => {
            console.error('❌ Ошибка регистрации Service Worker:', error);
          });
        
        // Слушаем обновления Service Worker
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('🔄 Service Worker контроллер изменился');
          // ⭐⭐⭐ НОВОЕ: Перезагружаем страницу при обновлении SW
          window.location.reload();
        });
      });
      
      // ⭐⭐⭐ КРИТИЧНО: Принудительная очистка кэша main.dart.js при загрузке
      if ('caches' in window) {
        window.addEventListener('load', () => {
          fetch('/main.dart.js?v=' + APP_VERSION, { cache: 'no-store' })
            .then(() => console.log('[HTML] ✅ main.dart.js загружен с no-cache'))
            .catch((e) => console.error('[HTML] ❌ Ошибка загрузки main.dart.js:', e));
        });
      }
    } else {
      console.warn('⚠️ Service Worker не поддерживается в этом браузере');
    }
  </script>

  <!-- ========================================= -->
  <!-- ОБРАБОТЧИК TITLE ДЛЯ НЕПРОЧИТАННЫХ        -->
  <!-- ========================================= -->
  <script>
    (function() {
      let unreadCount = 0;
      const originalTitle = 'SecureWave';

      console.log('[Title Handler] 📋 Инициализация обработчика title...');

      // Функция обновления title
      function updateTitle() {
        if (unreadCount > 0) {
          document.title = `(${unreadCount}) ${originalTitle}`;
          console.log('[Title Handler] ✅ Title обновлен:', document.title);
        } else {
          document.title = originalTitle;
          console.log('[Title Handler] ✅ Title сброшен:', document.title);
        }
      }

      // Слушаем сообщения от Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', (event) => {
          console.log('[Title Handler] 📨 Получено сообщение от SW:', event.data);
          
          if (event.data && event.data.type === 'UPDATE_TITLE') {
            const increment = event.data.increment || 1;
            unreadCount += increment;
            console.log('[Title Handler] 📈 Увеличение счетчика на', increment, '-> новый счет:', unreadCount);
            updateTitle();
          }
        });
        
        console.log('[Title Handler] ✅ Listener для SW зарегистрирован');
      } else {
        console.warn('[Title Handler] ⚠️ Service Worker не поддерживается');
      }

      // Сброс счетчика при фокусе на окне
      window.addEventListener('focus', () => {
        console.log('[Title Handler] 🔍 Окно получило фокус, сброс счетчика');
        unreadCount = 0;
        updateTitle();
      });

      // Сброс при изменении видимости страницы
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          console.log('[Title Handler] 👁️ Страница стала видимой, сброс счетчика');
          unreadCount = 0;
          updateTitle();
        } else {
          console.log('[Title Handler] 🙈 Страница скрыта');
        }
      });

      // API для использования из Flutter/JavaScript
      window.updateUnreadCount = function(count) {
        console.log('[Title Handler] 🔢 Установка счетчика:', count);
        unreadCount = Math.max(0, count);
        updateTitle();
      };

      window.incrementUnreadCount = function(increment = 1) {
        console.log('[Title Handler] ➕ Увеличение счетчика на:', increment);
        unreadCount += increment;
        updateTitle();
      };

      window.decrementUnreadCount = function(decrement = 1) {
        console.log('[Title Handler] ➖ Уменьшение счетчика на:', decrement);
        unreadCount = Math.max(0, unreadCount - decrement);
        updateTitle();
      };

      window.resetUnreadCount = function() {
        console.log('[Title Handler] 🔄 Полный сброс счетчика');
        unreadCount = 0;
        updateTitle();
      };

      // Экспортируем для доступа из других скриптов
      window.titleHandler = {
        getCount: () => unreadCount,
        setCount: (count) => window.updateUnreadCount(count),
        increment: () => window.incrementUnreadCount(),
        decrement: () => window.decrementUnreadCount(),
        reset: () => window.resetUnreadCount()
      };

      console.log('[Title Handler] 🎉 Обработчик title инициализирован успешно');
    })();
  </script>

</body>
</html>
